# Publishing the React adapter to npm, without a token anywhere.
#
# This release cost an evening because publishing by hand needs a human with a
# second factor, and the credentials that avoid that are exactly the ones npm
# is now restricting: "npm tokens that bypass 2FA are being restricted for
# account changes and direct publishing".
#
# Trusted publishing is npm's answer. GitHub signs a short-lived OIDC token
# saying which repository and which workflow is asking, npm checks that against
# what the package expects, and mints a credential good for this one publish.
# Nothing long-lived exists to leak, to rotate, or to paste into a chat window.
#
# One-time setup on npmjs.com, on the package's Settings tab:
#   Trusted publisher -> GitHub Actions
#   Organisation or user: TryShipFast
#   Repository:           live-edit
#   Workflow filename:    publish-react.yml
#
# After that, releasing this package is:
#   git tag react-vX.Y.Z && git push origin react-vX.Y.Z
# and the PHP engine keeps its own plain vX.Y.Z tags for Packagist.
name: Publish the React adapter

# Its own tag prefix, because this repository ships two packages from one
# history. A plain v* tag is the PHP engine going to Packagist, and the React
# adapter moves on its own schedule: the composer rename went out as v0.10.1
# while this package was still 0.10.0, and a shared trigger would have failed
# that publish on a version check for no reason anybody would enjoy debugging.
on:
  push:
    tags: ['react-v*']
  # So a release can be made without tagging, and so the first run can be
  # tried deliberately rather than by pushing a tag and hoping.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # The whole point: this is what lets GitHub mint the identity token npm
      # trusts. Without it the publish falls back to looking for a secret,
      # finds none, and fails.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm. The one bundled with Node 22 is
      # older than the feature, and the failure it gives is about
      # authentication rather than about the version, which sends you looking
      # in the wrong place.
      - name: Use an npm that understands trusted publishing
        run: npm install -g npm@latest

      # Only the tests that cover what is being published, and only the ones
      # that need nothing but Node. tests/js as a whole does not qualify: some
      # of it drives the PHP applier through a subprocess to prove the browser
      # and the server agree, which needs a PHP toolchain this job has no
      # reason to install. The first run failed on exactly that, which is the
      # guard working and the selection being wrong.
      - name: Check the tests that guard this package
        run: |
          npm ci --ignore-scripts
          npx vitest run \
            tests/react \
            tests/js/codemod-renders-what-jsx-rendered.test.js \
            tests/js/the-types-describe-what-ships.test.js \
            tests/js/the-codemod-leaves-the-right-files-alone.test.js

      # The declarations, compiled the way a customer compiles them.
      #
      # Everything above is JavaScript, and a JavaScript suite cannot see a
      # type. index.d.ts described two of the ten symbols its own entry point
      # exports and shipped; a customer's build broke on code our codemod had
      # just written for them, 167 errors across 19 files.
      #
      # The fixture is generated output rather than sample usage, and it
      # imports from BOTH entry points - because the fix after that described
      # index.d.ts, left server.d.ts alone, and shipped again. A check that
      # imported only from the client entry would have gone green on it, which
      # is exactly what the test written alongside that fix did.
      - name: Check the types a consumer would compile against
        run: npm run test:types

      # Refuse to publish a version that does not match the tag. A tag saying
      # v0.11.0 that ships 0.10.0 is worse than a failed release: the registry
      # and the repository disagree and nobody notices until somebody reports
      # a bug against a version that was never built.
      - name: Check the tag and the manifest agree
        if: startsWith(github.ref, 'refs/tags/react-v')
        run: |
          TAG="${GITHUB_REF_NAME#react-v}"
          PKG=$(node -p "require('./packages/react/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        working-directory: packages/react
        run: npm publish --access public
