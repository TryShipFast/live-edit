# Publishing the React adapter to npm, without a token anywhere.
#
# This release cost an evening because publishing by hand needs a human with a
# second factor, and the credentials that avoid that are exactly the ones npm
# is now restricting: "npm tokens that bypass 2FA are being restricted for
# account changes and direct publishing".
#
# Trusted publishing is npm's answer. GitHub signs a short-lived OIDC token
# saying which repository and which workflow is asking, npm checks that against
# what the package expects, and mints a credential good for this one publish.
# Nothing long-lived exists to leak, to rotate, or to paste into a chat window.
#
# One-time setup on npmjs.com, on the package's Settings tab:
#   Trusted publisher -> GitHub Actions
#   Organisation or user: TryShipFast
#   Repository:           live-edit
#   Workflow filename:    publish-react.yml
#
# After that, releasing is `git tag vX.Y.Z && git push --tags`.
name: Publish the React adapter

on:
  push:
    tags: ['v*']
  # So a release can be made without tagging, and so the first run can be
  # tried deliberately rather than by pushing a tag and hoping.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # The whole point: this is what lets GitHub mint the identity token npm
      # trusts. Without it the publish falls back to looking for a secret,
      # finds none, and fails.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm. The one bundled with Node 22 is
      # older than the feature, and the failure it gives is about
      # authentication rather than about the version, which sends you looking
      # in the wrong place.
      - name: Use an npm that understands trusted publishing
        run: npm install -g npm@latest

      - name: Check the tests that guard this package
        run: |
          npm ci --ignore-scripts
          npx vitest run tests/js tests/react

      # Refuse to publish a version that does not match the tag. A tag saying
      # v0.11.0 that ships 0.10.0 is worse than a failed release: the registry
      # and the repository disagree and nobody notices until somebody reports
      # a bug against a version that was never built.
      - name: Check the tag and the manifest agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/react/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        working-directory: packages/react
        run: npm publish --access public
