<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#F4F4F2;font-family:system-ui,sans-serif;color:#222}a{color:#B3261E}a:hover{color:#14161A}</style></helmet>
<section style="padding:40px;display:flex;flex-direction:column;gap:24px">
  <h1 style="margin:0;font-size:28px">32 Third Chair — low-fi wireframes (homes + key pages)</h1>
  <p style="margin:0;font-size:15px;max-width:760px">Grey = photo, outlined = content, red = action. One visitor per home; no section repeats across homes.</p>
  <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
    <sc-for list="{{ boards }}" as="b" hint-placeholder-count="6">
      <div id="{{ b.id }}" style="width:300px;background:#fff;border:1px solid #ccc;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;align-items:center"><span style="background:#14161A;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px">{{ b.id }}</span><strong style="font-size:15px">{{ b.t }}</strong></div>
        <div style="font-size:13px;color:#555">{{ b.who }}</div>
        <sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="5"><div style="height:{{ r.h }};background:{{ r.bg }};border:{{ r.bd }};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:{{ r.c }};text-align:center;padding:0 6px">{{ r.l }}</div></sc-for>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const P=(l,h='90px')=>({l,h,bg:'#CFCFCB',bd:'none',c:'#333'}),C=(l,h='54px')=>({l,h,bg:'#fff',bd:'1px solid #999',c:'#333'}),A=(l,h='34px')=>({l,h,bg:'#B3261E',bd:'none',c:'#fff'});
    return {boards:[
      {id:'1a',t:'Home 1 — walk-in',who:'Passer-by on a phone: anyone free now?',rows:[C('nav · Book','28px'),P('Full-bleed shop photo, crossfade ×3 · "Walk in. Chair three is kept free."','150px'),A('Book · See the chair board'),C('Chair board: 4 barbers × next free times + chair-three wait + hold my spot','110px'),C('Price columns: Cuts | Beard & shave','80px'),P('Work filmstrip (scroll)','70px'),C('Barber rail (scroll)','70px'),C('Hours + map band'),C('Footer · policies · privacy · fictional','40px')]},
      {id:'1b',t:'Home 2 — new client',who:'Booking ahead; which barber, what cut',rows:[C('nav · Book','28px'),P('Statement over full-width photo band','120px'),C('Founder note + portrait','80px'),C('Rating line (Sample)','30px'),C('Barber portraits ×4 · specialty · Book with','100px'),C('Price menu: cuts / beard / shave','90px'),C('Market Quarter guide + hours','70px'),C('Footer','40px')]},
      {id:'1c',t:'Home 3 — regular',who:'Every 3–4 weeks; quick rebook, membership',rows:[C('nav · Book','28px'),{l:'Split: photo left | headline + Book my barber',h:'120px',bg:'linear-gradient(90deg,#CFCFCB 50%,#fff 50%)',bd:'1px solid #999',c:'#333'},P('Gallery mosaic','110px'),C('Cut Club plans: Monthly cut | Cut + beard','90px'),C('Two quotes','60px'),C('Product shelf ×4','70px'),C('FAQ','70px'),C('Footer','40px')]},
      {id:'1d',t:'Book (request)',who:'Service → barber → time → details',rows:[C('Service cards'),C('Barber (or first free)'),C('Day + time slots','70px'),C('Name · phone · email · notes'),C('Deposit + late arrival note','36px'),A('Send request')]},
      {id:'1e',t:'Service page',who:'Skin fade etc.',rows:[P('Photo + title + 45 min + price (Sample)','110px'),C('What happens, in plain words','70px'),C('Who does it best (barbers)'),C('Aftercare + how often'),A('Book this')]},
      {id:'1f',t:'Barber page',who:'Pick the right barber',rows:[P('Portrait (monogram)','110px'),C('Specialties + years + qualified (Sample)'),C('Next free today'),C('Their work ×3','60px'),A('Book with them')]}
    ]};
  }
}
</script>
</body>
</html>
